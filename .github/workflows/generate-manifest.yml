name: Generate and Publish manifests

on:
  push:
    branches:
      - main
    paths:
      - 'generate-*-manifest.sh'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.find.outputs.scripts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Find scripts to process
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCRIPTS=$(ls generate-*-manifest.sh 2>/dev/null | jq -R . | jq -sc .)
          else
            SCRIPTS=$(git diff --name-only HEAD~1 HEAD -- 'generate-*-manifest.sh' | jq -R . | jq -sc .)
          fi
          echo "scripts=${SCRIPTS}" >> $GITHUB_OUTPUT

  generate-and-publish:
    needs: detect
    if: ${{ needs.detect.outputs.scripts != '[]' && needs.detect.outputs.scripts != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        script: ${{ fromJson(needs.detect.outputs.scripts) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Extract product name and version
        id: meta
        run: |
          SCRIPT="${{ matrix.script }}"
          PRODUCT=$(echo "$SCRIPT" | sed 's/generate-//' | sed 's/-manifest\.sh//')
          VERSION=$(grep -E '^[A-Z_]*VERSION=' "$SCRIPT" | head -1 | cut -d'=' -f2 | sed 's/^v//')
          echo "product=${PRODUCT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate manifest
        env:
          WORKDIR: ${{ runner.temp }}/hauler
        run: bash ${{ matrix.script }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest to GHCR
        working-directory: ${{ runner.temp }}/hauler
        run: |
          oras push \
            "ghcr.io/${{ github.repository }}/hauler/${{ steps.meta.outputs.product }}-manifest.yaml:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.product }}-manifest.yaml:application/yaml"
