name: Generate and Publish cert-manager manifest

on:
  push:
    branches:
      - main
    paths:
      - generate-certmanager-manifest.sh
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^CERTMANAGER_VERSION=' generate-certmanager-manifest.sh | cut -d'=' -f2)
          echo "value=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate manifest
        env:
          WORKDIR: ${{ runner.temp }}/hauler
        run: bash generate-certmanager-manifest.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest to GHCR
        working-directory: ${{ runner.temp }}/hauler
        run: |
          oras push \
            "ghcr.io/${{ github.repository }}/hauler/cert-manager-manifest.yaml:${{ steps.version.outputs.value }}" \
            "certmanager-manifest.yaml:application/yaml"
